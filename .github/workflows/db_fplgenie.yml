# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fplgenie

on:
  push:
    branches:
      - db
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build application
        run: npm run build --if-present

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r .next deploy/
          cp -r public deploy/ 2>/dev/null || :
          cp package*.json deploy/
          cp next.config.* deploy/ 2>/dev/null || :

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A52F670421843B5BC8A41615AD740EF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B614AA6EF7F44EA7967413E30B26E595 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1A5794080FFD445F96A3C9E2EEBBB603 }}

      - name: Configure Azure App Settings
        run: |
          az webapp config appsettings set \
            --name fplgenie \
            --resource-group $(az webapp show --name fplgenie --query resourceGroup -o tsv) \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
              WEBSITE_NODE_DEFAULT_VERSION="22" \
              ENABLE_ORYX_BUILD="true"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "fplgenie"
          slot-name: "Production"
          package: ./deploy
